# Project description (for supplementary abstract context)
project_description: >
  This framework identifies areas where wetland conservation or enhancement
  will have the greatest impact for communities in the Albemarle-Pamlico
  estuarine system. It integrates two components: (1) a Wetland Suitability
  Index (WSI) that evaluates biophysical restoration potential from existing
  wetlands, riparian zones, landcover, soil drainage, and slope under current
  and projected 2070 conditions, and (2) Community Resilience Priority Areas
  (CRPA) that identify disadvantaged communities using the EPA EJScreen, the
  Climate and Economic Justice Screening Tool, FUTURES 3 land-change forecasts,
  and the Headwaters Economics Rural Capacity Index. Opportunity areas are
  identified where high wetland suitability intersects CRPA buffer zones,
  with protected lands excluded.

# Per-raster contentInfo section (attributeDescription + contentType)
content:
  apnep-wsi-conserve:
    attribute_description: >
      Band 1 - Wetland Suitability Index (WSI) score. Values range from 0.0 to
      5.0 in 0.25-step increments. Higher values indicate greater suitability for
      wetland conservation. NoData pixels have no value.
    content_type: "thematicClassification"

  apnep-wsi-conserve-highsuit:
    attribute_description: >
      Band 1 - Binary high suitability classification. 1 = above threshold (WSI
      >= 3.5), 0 = below threshold. NoData = 255.
    content_type: "thematicClassification"

  apnep-wsi-enhance:
    attribute_description: >
      Band 1 - Wetland Suitability Index (WSI) score. Values range from 0.0 to
      5.0 in 0.25-step increments. Higher values indicate greater suitability for
      wetland enhancement. Spatial smoothing applied. NoData pixels have no value.
    content_type: "thematicClassification"

  apnep-wsi-enhance-highsuit:
    attribute_description: >
      Band 1 - Binary high suitability classification. 1 = above threshold (WSI
      >= 3.5), 0 = below threshold. NoData = 255.
    content_type: "thematicClassification"

  apnep-wsi-combine:
    attribute_description: >
      Band 1 - Combined suitability class. 0 = neither scenario, 1 = conservation
      only, 2 = enhancement only, 3 = both conservation and enhancement.
      NoData = 255.
    content_type: "thematicClassification"

  apnep-oppareas-padusmask:
    attribute_description: >
      Band 1 - Opportunity area class. 0 = no opportunity, 1 = conservation
      opportunity only, 2 = enhancement opportunity only, 3 = both, 15 = PADUS
      protected area (NoData).
    content_type: "thematicClassification"

  apnep-wsi-popup-multiband:
    attribute_description: >
      Band 1 - Conservation WSI score (0.0 to 5.0). Band 2 - Enhancement WSI
      score (0.0 to 5.0). Band 3 - County GEOID integer for county-name lookup.
    content_type: "thematicClassification"

# Per-scenario lineage processStep descriptions
# Source data citations are appended automatically from repro_weight.yaml
lineage:
  conservation:
    description: >
      Weighted overlay of eight suitability and constraint layers. Score layers:
      existing wetlands (weight 2), riparian areas (weight 2), low-barrier landcover
      (weight 1), soil drainage (weight 1), slope (weight 1). Exclusion masks: open
      water, high-barrier landcover, contaminated lands. The raw weighted sum was
      classified to 0.25-step increments (range 0.0-5.0). A threshold of 3.5 was
      applied to produce the binary high-suitability layer.
  enhancement:
    description: >
      Weighted overlay of eight suitability and constraint layers. Score layers:
      potential wetlands 2070 from the Sohl et al. (2018) land cover projections (weight 2), riparian areas
      (weight 2), low-barrier landcover (weight 1), soil drainage (weight 1), slope
      (weight 1). Exclusion masks: open water, high-barrier landcover, contaminated
      lands. The raw weighted sum was classified to 0.25-step increments (range
      0.0-5.0). A circular focal mean (radius 8 pixels, approximately 240 meters)
      was applied for spatial smoothing, then re-classified to 0.25 steps. A
      threshold of 3.5 was applied to produce the binary high-suitability layer.
  combine:
    description: >
      The conservation and enhancement high-suitability binary rasters were combined
      by adding conservation (0 or 1) to 2 times enhancement (0 or 1), producing
      four classes: 0 = neither, 1 = conservation only, 2 = enhancement only, 3 = both.
  popup:
    description: >
      The conservation and enhancement WSI rasters were assembled into a
      three-band GeoTIFF (bands 1-2 = WSI scores, band 3 = county GEOIDs
      rasterized from U.S. Census Bureau TIGER/Line 2024 county boundaries,
      500k generalized), masked to the APNEP management boundary for popup
      display in the interactive web map.
  opportunity:
    description: >
      The combined high-suitability raster was intersected with Community
      Resilience Priority Areas (CRPA) 300-meter buffer zones (class 4). Areas within the
      Protected Areas Database of the United States (PADUS) were set to NoData.
