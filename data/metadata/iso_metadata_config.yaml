description:
  titles:
    apnep-wsi-conserve: "APNEP Wetland Suitability Index, Conservation Scenario, Albemarle-Pamlico Estuarine System, North Carolina and Virginia, 2024"
    apnep-wsi-conserve-highsuit: "APNEP High Suitability Areas, Conservation Scenario, Albemarle-Pamlico Estuarine System, North Carolina and Virginia, 2024"
    apnep-wsi-enhance: "APNEP Wetland Suitability Index, Enhancement Scenario, Albemarle-Pamlico Estuarine System, North Carolina and Virginia, 2024-2070"
    apnep-wsi-enhance-highsuit: "APNEP High Suitability Areas, Enhancement Scenario, Albemarle-Pamlico Estuarine System, North Carolina and Virginia, 2024-2070"
    apnep-wsi-combine: "APNEP Combined Wetland Suitability, Conservation and Enhancement Overlap, Albemarle-Pamlico Estuarine System, North Carolina and Virginia"
    apnep-oppareas-padusmask: "APNEP Wetland Conservation and Enhancement Opportunity Areas, Albemarle-Pamlico Estuarine System, North Carolina and Virginia"
    apnep-wsi-popup-multiband: "APNEP Wetland Suitability Popup Layer, Albemarle-Pamlico Estuarine System, North Carolina and Virginia"

  abstracts:
    apnep-wsi-conserve: >
      Wetland Suitability Index (WSI) raster for the conservation scenario in the
      Albemarle-Pamlico river basin, North Carolina. Pixel values represent a
      weighted suitability score (0.0 to 5.0 in 0.25-step increments) derived from
      a weighted overlay of eight input layers: existing wetlands, riparian areas,
      low-barrier landcover, soil drainage, and slope as scoring layers; open water,
      high-barrier landcover, and contaminated lands as exclusion masks. Cell size
      is 30 meters; coordinate system is NAD83 / North Carolina State Plane
      (EPSG:32119). Produced for the Albemarle-Pamlico National Estuary Partnership
      (APNEP) by North Carolina State University, Center for Geospatial Analytics.

    apnep-wsi-conserve-highsuit: >
      Binary raster identifying high-suitability areas for wetland conservation in
      the Albemarle-Pamlico river basin, North Carolina. Derived by applying a
      threshold of 3.5 to the conservation Wetland Suitability Index (WSI). Pixel
      values: 1 = high suitability, 0 = below threshold. NoData = 255. Cell size
      is 30 meters; coordinate system is NAD83 / North Carolina State Plane
      (EPSG:32119).

    apnep-wsi-enhance: >
      Wetland Suitability Index (WSI) raster for the enhancement scenario in the
      Albemarle-Pamlico river basin, North Carolina. Pixel values represent a
      weighted suitability score (0.0 to 5.0 in 0.25-step increments) derived from
      a weighted overlay of eight input layers: potential wetlands from the Sohl et
      al. (2018) conterminous United States land cover projections (2070), riparian
      areas, low-barrier landcover, soil
      drainage, and slope as scoring layers; open water, high-barrier landcover, and
      contaminated lands as exclusion masks. A circular focal mean (radius 8 pixels,
      approximately 240 meters) was applied for spatial smoothing. Cell size is 30
      meters; coordinate system is NAD83 / North Carolina State Plane (EPSG:32119).
      Produced for the Albemarle-Pamlico National Estuary Partnership (APNEP) by
      North Carolina State University, Center for Geospatial Analytics.

    apnep-wsi-enhance-highsuit: >
      Binary raster identifying high-suitability areas for wetland enhancement in
      the Albemarle-Pamlico river basin, North Carolina. Derived by applying a
      threshold of 3.5 to the enhancement Wetland Suitability Index (WSI). Pixel
      values: 1 = high suitability, 0 = below threshold. NoData = 255. Cell size
      is 30 meters; coordinate system is NAD83 / North Carolina State Plane
      (EPSG:32119).

    apnep-wsi-combine: >
      Combined wetland suitability raster showing overlap between conservation and
      enhancement high-suitability areas in the Albemarle-Pamlico river basin, North
      Carolina. Derived by overlaying the conservation and enhancement high-suitability
      binary rasters. Pixel encoding: 0 = neither scenario, 1 = conservation only,
      2 = enhancement only, 3 = both conservation and enhancement. NoData = 255.
      Cell size is 30 meters; coordinate system is NAD83 / North Carolina State Plane
      (EPSG:32119).

    apnep-oppareas-padusmask: >
      Opportunity areas for wetland conservation and enhancement in the
      Albemarle-Pamlico river basin, North Carolina. Derived from the combined
      high-suitability raster intersected with Community Resilience
      Priority Areas (CRPA) 300-meter buffer zones (class 4), with lands from
      the Protected Areas
      Database of the United States (PADUS) excluded. Pixel encoding: 0 = no
      opportunity, 1 = conservation opportunity only, 2 = enhancement opportunity
      only, 3 = both, 15 = PADUS-protected area (NoData). Cell size is 30 meters;
      coordinate system is NAD83 / North Carolina State Plane (EPSG:32119).

    apnep-wsi-popup-multiband: >
      Three-band raster built for popup display in the interactive web map.
      Band 1 holds the conservation Wetland Suitability Index score (0.0 to 5.0),
      Band 2 holds the enhancement Wetland Suitability Index score (0.0 to 5.0),
      and Band 3 holds county GEOIDs rasterized from U.S. Census Bureau
      TIGER/Line 2024 county boundaries (500k generalized) for county-name
      lookup. Cell size is 30 meters; coordinate system is NAD83 / North
      Carolina State Plane (EPSG:32119).

