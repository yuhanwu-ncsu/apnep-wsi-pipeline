# Known issues / quality caveats (appended to lineage statement)
known_issues: >
  30-m resolution limits application to regional targeting; the rasters are
  not suitable for parcel-level decisions. The enhancement scenario depends
  on modeled 2070 land cover with inherent uncertainty. The 3.5 threshold is
  a planning cutoff, not an ecological boundary — pixels just below it may
  still hold restoration value. Focal smoothing (enhancement only) merges
  nearby patches and may dilute small, isolated wetland pockets.

